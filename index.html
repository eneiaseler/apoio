<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materiais de Apoio · Eneias Eler</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0A0A; --fg:#E8E4DC; --fg-dim:#8A8070; --gold:#C9A86A; --gold-deep:#8C7345; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:'Manrope',system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         text-align:center; padding:24px; }
  .kicker { font-size:13px; letter-spacing:.35em; text-transform:uppercase; color:var(--gold); margin-bottom:28px; }
  h1 { font-family:'Fraunces',Georgia,serif; font-variation-settings:'opsz' 144; font-weight:300;
       font-size:clamp(38px,7vw,72px); line-height:1.1; }
  h1 em { font-style:italic; color:var(--gold); }
  .desc { margin-top:24px; font-weight:300; color:var(--fg-dim); font-size:clamp(15px,2vw,18px); max-width:44ch; line-height:1.6; }
  .sep { width:64px; border-top:1px solid var(--gold-deep); margin:36px auto; }
  .links { display:flex; gap:28px; justify-content:center; flex-wrap:wrap; font-size:15px; }
  .links a { color:var(--gold); text-decoration:none; letter-spacing:.04em; }
  .links a:hover { color:var(--fg); }
</style>
</head>
<body>
  <div class="kicker">Educação Financeira</div>
  <h1>Materiais de apoio<br><em>Eneias Eler</em></h1>
  <p class="desc">Cada palestra tem seu material no endereço divulgado no telão. Guarde, releia e faça as três tarefas.</p>
  <div class="sep"></div>
  <div class="links">
    <a href="https://www.instagram.com/eneiaseler">@eneiaseler</a>
    <a href="https://www.youtube.com/valoriza">youtube.com/valoriza</a>
  </div>
</body>
</html>
